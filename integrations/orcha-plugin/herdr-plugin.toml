id = "easy-job"
name = "Easy Job"
version = "0.1.2"
min_herdr_version = "0.9.0"
description = "Open the Easy Job office for your agents"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Open Easy Job"
command = ["easy-job", "open", "--via-orcha"]

[[panes]]
id = "server"
title = "Easy Job"
placement = "tab"
command = ["easy-job", "serve", "--no-open"]
